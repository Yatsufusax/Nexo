name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Pruebas unitarias y APK debug
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Subir APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Subir reportes si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-error
          path: |
            app/build/reports/
            app/build/test-results/
